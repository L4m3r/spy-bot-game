<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Шпион</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="mask" viewBox="0 0 24 24"><path d="m3 7 9 2 9-2v6c0 3-2 5-4 5-3 0-3-3-5-3s-2 3-5 3c-2 0-4-2-4-5Z"/><path d="m6 11 3 1m6 0 3-1"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></symbol>
    <symbol id="link" viewBox="0 0 24 24"><path d="m10 7 2-2a5 5 0 0 1 7 7l-3 3a5 5 0 0 1-7 0m5 2-2 2a5 5 0 0 1-7-7l3-3a5 5 0 0 1 7 0"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></symbol>
    <symbol id="exit" viewBox="0 0 24 24"><path d="M10 4H5v16h5m-1-8h12m-5-5 5 5-5 5"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-6 3V6a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3Z"/><path d="M7 8h9m-9 5h6"/></symbol>
    <symbol id="card" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="9" r="2.5"/><path d="M8 17a4 4 0 0 1 8 0"/></symbol>
  </svg>
  <main>
    <nav class="back-nav"><button id="back" class="back" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg>Назад</button></nav>
    <div id="view"></div>
  </main>
  <footer id="action-bar" hidden><button id="main-action" class="primary" type="button"></button></footer>
  <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <dialog id="confirmation" aria-labelledby="dialog-title" aria-describedby="dialog-copy">
    <h2 id="dialog-title"></h2><p id="dialog-copy"></p>
    <div class="dialog-actions"><button id="dialog-cancel" type="button">Отмена</button><button id="dialog-confirm" type="button">Продолжить</button></div>
  </dialog>
</body>
</html>
